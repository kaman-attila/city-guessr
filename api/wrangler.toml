name = "api"
main = "build/index.js"
compatibility_date = "2026-10-14"
routes = [{ pattern = "pinthecity.me", custom_domain = true }]

[triggers]
crons = ["30 3 * * *"]

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

[vars]
APP_URL = "https://pinthecity.me"
EMAIL_FROM = "PinTheCity <no-reply@pinthecity.me>"

[[d1_databases]]
binding = "DB"
database_name = "city-game"
database_id = "221f05b6-5201-4c7a-a84e-76c94907646f"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]