[package]
name = "api"
version = "0.1.0"
edition = "2021"
authors = ["Attila Kámán <kmnttl@gmail.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum'] }
worker-macros = { version = "0.8", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3.3"
serde_json = "1.0.154"
