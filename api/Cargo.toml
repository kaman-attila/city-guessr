[package]
name = "api"
version = "0.1.0"
edition = "2021"
authors = ["Attila Kámán <kmnttl@gmail.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum', 'd1'] }
worker-macros = { version = "0.8", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3.3"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
js-sys = "0.3.106"
sha2 = "0.11.1"
wasm-bindgen-futures = "0.4.79"
