<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Blue Earth Globe Grid -->
  <g stroke="#c1ccd9" stroke-width="3" fill="none">
    <!-- Outer Globe Edge -->
    <circle cx="50" cy="50" r="45" />
    <!-- Vertical Longitude Arcs -->
    <ellipse cx="50" cy="50" rx="20" ry="45" />
    <line x1="50" y1="5" x2="50" y2="95" />
    <!-- Horizontal Latitude Arcs -->
    <ellipse cx="50" cy="50" rx="45" ry="15" />
    <line x1="5" y1="50" x2="95" y2="50" />
  </g>

  <!-- Angled Green Map Pin -->
  <g transform="rotate(-25 50 50)">
    <!-- Pin Body -->
    <path d="M 25,35 A 25,25 0 1,1 75,35 C 75,65 50,95 50,95 C 50,95 25,65 25,35 Z" fill="#5b8b2c" stroke="#101420" stroke-width="6" stroke-linejoin="round" />
    <!-- Inner Dark Hole/Dot -->
    <circle cx="50" cy="35" r="8" fill="#101420" />
  </g>
</svg>